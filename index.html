<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Health Diary</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#f8f5f3"><link rel="apple-touch-icon" href="icon.png"><style>*{box-sizing:border-box}body{margin:0;background:#f8f5f3;color:#51464f;font:15px system-ui}main{max-width:850px;margin:auto;padding:24px 16px 100px}h1{font:italic 38px Georgia;margin:8px 0}h2{font:26px Georgia}h3{font-size:15px}small{color:#82757e}section,.card{background:#fffdfb;border:1px solid #eadfe3;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #72536b08}button,input,select,textarea{font:inherit;border:1px solid #e5d9df;border-radius:12px;padding:10px;color:inherit;background:white;max-width:100%}button{cursor:pointer;background:#e8d9e7}button.active{background:#98677d;color:white}label{display:block;margin:10px 0}input[type=checkbox]{accent-color:#a47b9c;width:18px;height:18px;vertical-align:middle}input[type=number]{width:85px}textarea{width:100%;min-height:75px}nav{position:sticky;top:0;background:#f8f5f3ee;display:flex;gap:5px;overflow:auto;padding:8px 0;z-index:2}nav button{flex:1;white-space:nowrap;font-size:13px;padding:10px 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.tile{background:#d5e4d3;border-radius:16px;padding:16px}.tile:nth-child(even){background:#ebcdd7}.big{font:30px Georgia}.set{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}.set input{width:78px}.muted{background:#f4eee8}.danger{background:#f6e5e5}progress{width:100%;accent-color:#a78da8} .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} @media(max-width:450px){main{padding:15px 10px 60px}section{padding:14px}nav button{font-size:11px}}body{background:linear-gradient(145deg,#f8f5f3,#f5eef2);min-height:100vh}main{max-width:720px}nav{position:sticky;top:0;backdrop-filter:blur(14px);background:#f8f5f3e8;border-radius:16px}button{background:#e8d8e3;min-height:40px}section{border:0;box-shadow:0 5px 24px #61465b0b}h1{color:#805d70}h2{color:#805d70;margin-top:4px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.calendar button{padding:5px;background:#edf3e9}.calendar button.active{background:#98677d}.mealphoto{width:100%;max-height:300px;object-fit:contain;border-radius:16px}.bar{height:12px;background:#a8c2a2;border-radius:9px}details{padding:10px 0;border-bottom:1px solid #eee}summary{cursor:pointer} @media print{body{background:white}main>*{display:none!important}#view{display:block!important}#view>*{display:none!important}#report{display:block!important}#report button{display:none}#report .card{break-inside:avoid}}</style><main><small>PROJETO HEALTH • um dia de cada vez</small><h1>Health Diary ✿</h1><p>Força, equilíbrio e cuidado.</p><div class="row"><label>Data <input id="date" type="date"></label><small id="status">Salvamento local</small></div><nav id="nav"></nav><div id="view"></div><section><small>Seus dados ficam neste navegador, não são enviados ao ChatGPT. Exporte uma cópia regularmente.</small><div class="row"><button onclick="backup()">Exportar dados</button><button onclick="document.getElementById('restore').click()">Importar dados</button><input hidden type="file" id="restore" accept="application/json"></div></section></main><script>
const $=id=>document.getElementById(id), key='health-diary-v1';let db={};try{db=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){};let tab=0;const today=new Date();$('date').value=new Date(today-today.getTimezoneOffset()*60000).toISOString().slice(0,10);const names=['Início','Diário','Treinos','Alimentação','Evolução','Compras'];const acts=['Musculação','Cardio','Ballet','Pilates','Mobilidade','Flexibilidade','HIIT','Descanso'];const meals=['Café da manhã','Almoço','Lanche','Jantar','Ceia'];let habits=['Frutas','Verduras ou legumes','Hidratação adequada','Refeições suficientes','Respeitei meu descanso'];try{habits=JSON.parse(localStorage.getItem('health-habits')||'null')||habits}catch(e){};const presets={'Costas e bíceps':['Puxada alta','Remada','Pulldown','Rosca direta','Rosca martelo'],'Quadríceps e glúteos':['Leg press','Extensora','Afundo','Adutora','Abdutora'],'Peito, ombros e tríceps':['Supino reto','Supino inclinado','Tríceps corda','Tríceps polia','Elevação lateral'],'Glúteos e posteriores':['Elevação pélvica','Agachamento Smith','Búlgaro','Abdutora','Mesa flexora']};function day(){return db[$('date').value]??={activities:[],habits:[],meals:{},exercises:[]}}function save(){try{localStorage.setItem(key,JSON.stringify(db));$('status').textContent='✓ Salvo neste navegador'}catch(e){$('status').textContent='Não foi possível salvar — exporte os dados'}}function set(k,v){day()[k]=v;save()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function field(k,l,type='text'){return `<label>${l}<br><input type="${type}" ${type==='number'?'min="0" step="any"':''} value="${esc(day()[k])}" onchange="set('${k}',this.value)"></label>`}function note(k,l){return `<label>${l}<textarea onchange="set('${k}',this.value)">${esc(day()[k])}</textarea></label>`}function checks(k,arr){return arr.map((a,i)=>`<label><input type="checkbox" ${day()[k].includes(a)?'checked':''} onchange="toggle('${k}',${i},this.checked)"> ${a}</label>`).join('')}function toggle(k,i,on){let a=(k==='activities'?acts:habits)[i];day()[k]=day()[k].filter(x=>x!==a);if(on)day()[k].push(a);save()}function scale(k,l){return `<label>${l} <select onchange="set('${k}',this.value)"><option value="">Não registrado</option>${Array.from({length:11},(_,i)=>`<option ${String(day()[k])===String(i)?'selected':''}>${i}</option>`).join('')}</select></label>`}function render(){let d=day();$('nav').innerHTML=names.map((n,i)=>`<button class="${i===tab?'active':''}" onclick="tab=${i};render()">${n}</button>`).join('');let h='';if(tab===0){h=`<h2>Seu dia, com carinho ♡</h2><div class="grid"><div class="tile"><small>Atividades</small><div class="big">${d.activities.length}</div></div><div class="tile"><small>Musculação</small><div class="big">${esc(d.duration||'—')} min</div></div><div class="tile"><small>Cardio</small><div class="big">${esc(d.cardio||'—')} min</div></div><div class="tile"><small>Sono</small><div class="big">${esc(d.sleep||'—')} h</div></div></div><section><h3>Hoje</h3>${d.activities.map(esc).join(' · ')||'Nenhuma atividade registrada'}<p>${Object.values(d.meals).filter(m=>m.done).length} refeições registradas</p><p>${d.exercises.length} exercícios registrados</p><button onclick="tab=1;render()">Abrir diário</button></section>`}if(tab===1){h=`<section><h2>Meu diário</h2>${checks('activities',acts)}<div class="grid">${field('sleep','Horas de sono','number')}${field('duration','Musculação (min)','number')}${field('cardio','Cardio (min)','number')}${field('otherMinutes','Outras atividades (min)','number')}</div>${scale('energy','Energia (0–10)')}${scale('stress','Estresse (0–10)')}${scale('pain','Dor (0–10)')}${note('symptoms','Local da dor, tontura ou outros sintomas')}${note('mood','Como me senti hoje?')}</section>`}if(tab===2){h=`<section><h2>Meu treino</h2><div class="grid">${field('duration','Duração da musculação (min)','number')}${field('cardio','Cardio (min)','number')}</div><label>Tipo de treino<select id="preset"><option>Treino livre</option>${Object.keys(presets).map(x=>`<option>${x}</option>`).join('')}</select></label><button onclick="loadPreset()">Adicionar exercícios do treino</button><div class="row"><input id="newEx" placeholder="Nome do exercício"><button onclick="addEx()">+ Exercício</button></div></section>`+d.exercises.map((e,i)=>`<section><div class="row"><strong>${esc(e.name)}</strong><button class="danger" onclick="if(confirm('Remover exercício?')){day().exercises.splice(${i},1);save();render()}">Excluir</button></div><small>Carga em kg • repetições • RIR (opcional)</small>${e.sets.map((s,j)=>`<div class="set"><small>S${j+1}</small>${['kg','reps','rir'].map((k,z)=>`<input aria-label="${k}" type="number" min="0" step="${z===0?'0.5':'1'}" placeholder="${['kg','reps','RIR'][z]}" value="${esc(s[k])}" oninput="updateSet(${i},${j},'${k}',this.value)">`).join('')}<button onclick="day().exercises[${i}].sets.splice(${j},1);save();render()">×</button></div>`).join('')}<button onclick="day().exercises[${i}].sets.push({});save();render()">+ Série</button><label>Observações<textarea onchange="day().exercises[${i}].notes=this.value;save()">${esc(e.notes)}</textarea></label></section>`).join('')+`<section>${note('trainingNotes','Como foi o treino?')}</section>`}if(tab===3){h=`<section><h2>Alimentação</h2><small>Sem contagem obrigatória de calorias. A ceia é opcional.</small>${meals.map((m,i)=>{let v=d.meals[i]||{};return `<div class="card"><strong>${m}</strong><label><input type="checkbox" ${v.done?'checked':''} onchange="meal(${i},'done',this.checked)"> Fiz esta refeição</label><label><input type="checkbox" ${v.protein?'checked':''} onchange="meal(${i},'protein',this.checked)"> Incluí fonte de proteína</label><textarea placeholder="O que comi?" onchange="meal(${i},'notes',this.value)">${esc(v.notes)}</textarea></div>`}).join('')}<h3>Hábitos</h3>${checks('habits',habits)}${field('water','Água (litros, opcional)','number')}${note('foodNotes','Como foi minha alimentação? O que facilitou ou dificultou?')}</section>`}if(tab===4){let end=new Date($('date').value+'T12:00:00'), start=new Date(end);start.setDate(start.getDate()-6);let fmt=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;let entries=Object.entries(db).filter(([k])=>k>=fmt(start)&&k<=fmt(end)).sort();let sum=k=>entries.reduce((n,[_,v])=>n+(Number(v[k])||0),0);h=`<h2>Minha evolução</h2><small>Últimos 7 dias até ${$('date').value}</small><div class="grid"><div class="tile">Musculação<div class="big">${sum('duration')} min</div></div><div class="tile">Cardio<div class="big">${sum('cardio')} min</div></div><div class="tile">Treinos registrados<div class="big">${entries.filter(([_,v])=>v.exercises?.length||v.activities?.includes('Musculação')).length}</div></div></div><section><h3>Histórico de atividades</h3>${entries.map(([k,v])=>`<p><button onclick="$('date').value='${k}';tab=1;render()">${k.slice(8)}/${k.slice(5,7)}</button> ${v.activities.map(esc).join(' · ')||'—'}</p>`).join('')}<h3>Histórico de cargas</h3>${entries.flatMap(([k,v])=>v.exercises.map(e=>`<p><small>${k.slice(8)}/${k.slice(5,7)}</small> ${esc(e.name)} — ${e.sets.filter(s=>s.kg!==undefined||s.reps!==undefined).map(s=>`${esc(s.kg||'—')} kg × ${esc(s.reps||'—')}`).join(' / ')}</p>`)).join('')||'Sem registros'}</section><section><h3>Check-in semanal (opcional)</h3><div class="grid">${field('weight','Peso (kg)','number')}${field('hip','Quadril (cm)','number')}${field('thigh','Coxa (cm)','number')}${field('waist','Cintura (cm)','number')}</div>${note('weekly','Vitórias, recuperação, equilíbrio, flexibilidade e ajustes para a próxima semana')}</section>`}if(tab===0)h+=habitPanel();if(tab===2)h=timerPanel()+h;if(tab===3)h=macroPanel()+h;if(tab===5)h=shoppingPanel();$('view').innerHTML=h;tick()}function meal(i,k,v){(day().meals[i]??={})[k]=v;save()}function updateSet(i,j,k,v){day().exercises[i].sets[j][k]=v;save()}function addEx(){let n=$('newEx').value.trim();if(n){day().exercises.push({name:n,sets:[{},{},{}]});save();render()}}function loadPreset(){let p=presets[$('preset').value];if(p){p.forEach(name=>day().exercises.push({name,sets:[{},{},{}]}));save();render()}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({days:db,habits,shopping},null,2)],{type:'application/json'}));a.download='health-backup.json';a.click();URL.revokeObjectURL(a.href)}$('restore').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());let bundle=v.days?v:null;if(bundle)v=bundle.days;if(!v||typeof v!=='object'||Array.isArray(v)||!Object.entries(v).every(([k,d])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&Array.isArray(d.activities)&&Array.isArray(d.habits)&&Array.isArray(d.exercises)&&d.meals))throw Error();if(confirm('Substituir registros locais pelo backup?')){db=v;if(bundle){if(Array.isArray(bundle.habits))habits=bundle.habits;if(Array.isArray(bundle.shopping))shopping=bundle.shopping;try{localStorage.setItem('health-habits',JSON.stringify(habits));localStorage.setItem('health-shopping',JSON.stringify(shopping))}catch(e){}}save();render()}}catch(e){alert('Arquivo inválido')}};
function habitPanel(){return `<section><h2>Daily habits ♡</h2>${checks('habits',habits)}<div class="row"><input id="habitNew" placeholder="Novo hábito"><button onclick="addHabit()">Adicionar</button></div>${habits.map((h,i)=>`<div class="row"><small>${esc(h)}</small><button onclick="editHabit(${i})">Editar</button><button onclick="removeHabit(${i})">Excluir</button></div>`).join('')}</section>`}
function storeHabits(){try{localStorage.setItem('health-habits',JSON.stringify(habits))}catch(e){}save();render()}
function addHabit(){let n=$('habitNew').value.trim();if(n&&!habits.includes(n)){habits.push(n);storeHabits()}}
function editHabit(i){let n=prompt('Nome do hábito',habits[i]);if(n&&n.trim()&&!habits.includes(n.trim())){let old=habits[i];habits[i]=n.trim();Object.values(db).forEach(d=>{if(d.habits)d.habits=d.habits.map(x=>x===old?n.trim():x)});storeHabits()}}
function removeHabit(i){if(confirm('Remover da lista atual?')){habits.splice(i,1);storeHabits()}}
function active(){return Object.entries(db).find(([k,d])=>d.timer)}
function elapsed(t){return t.ms+(t.start?Date.now()-t.start:0)}
function timerPanel(){let a=active();return `<section style="background:#ebcdd7"><small>LIVE SESSION</small><h2>${a?esc(a[1].timer.type):'Vamos começar?'}</h2><div class="big" id="clock">00:00:00</div>${a?`<small>Iniciada em ${esc(a[0])}</small><div class="row"><button onclick="pauseTimer()">${a[1].timer.start?'Ⅱ Pausar':'▶ Retomar'}</button><button onclick="finishTimer()">✓ Finalizar</button></div>`:`<div class="row"><select id="activityType">${acts.filter(x=>x!=='Descanso').map(x=>`<option>${x}</option>`).join('')}</select><button onclick="startTimer()">▶ Iniciar atividade</button></div>`}<small>Registre suas séries abaixo enquanto o tempo corre.</small>${(day().sessions||[]).map(x=>`<p>${esc(x.type)} · ${x.minutes} min</p>`).join('')}</section>`}
function tick(){let a=active(),c=$('clock');if(c&&a){let n=Math.floor(elapsed(a[1].timer)/1000);c.textContent=[Math.floor(n/3600),Math.floor(n/60)%60,n%60].map(x=>String(x).padStart(2,'0')).join(':')}}
function startTimer(){if(active())return;day().timer={type:$('activityType').value,ms:0,start:Date.now()};save();render()}
function pauseTimer(){let a=active();if(!a)return;let t=a[1].timer;if(t.start){t.ms=elapsed(t);t.start=0}else t.start=Date.now();save();render()}
function finishTimer(){let a=active();if(!a)return;let d=a[1],t=d.timer,m=Math.round(elapsed(t)/6000)/10;(d.sessions??=[]).push({type:t.type,minutes:m});if(!d.activities.includes(t.type))d.activities.push(t.type);let k=t.type==='Musculação'?'duration':t.type==='Cardio'?'cardio':'otherMinutes';d[k]=Math.round(((Number(d[k])||0)+m)*10)/10;delete d.timer;save();render()}
const options=[['Pão integral + 2 ovos + muçarela', 'Cuscuz + ovos + fruta','Crepioca + queijo'],['Arroz + feijão + frango + salada','Wrap de carne + salada','Macarrão com carne e molho'],['Vitamina de leite, whey e morango','Iogurte + aveia + fruta','Pão + queijo + fruta'],['Macaxeira + carne + legumes','Hambúrguer caseiro + salada','Cuscuz + ovos + queijo'],['Leite com cacau','Iogurte + fruta']];
function macroPanel(){let d=day(),keys=['kcal','proteinG','carb','fat'];let totals=keys.map(k=>Object.values(d.meals).reduce((a,m)=>a+(Number(m[k])||0),0));return `<section><small>Estimativas opcionais • sem meta obrigatória</small><h2>Nutrição do dia</h2><div class="grid">${totals.map((n,i)=>`<div class="tile"><small>${['Energia (kcal)','Proteína (g)','Carboidrato (g)','Gordura (g)'][i]}</small><div class="big">${Object.values(d.meals).some(m=>m[keys[i]]!==undefined&&m[keys[i]]!=='')?Math.round(n*10)/10:'—'}</div></div>`).join('')}</div><small>Totais parciais dos valores preenchidos, não representam necessariamente o dia inteiro.</small>${meals.map((m,i)=>`<div class="card"><strong>${m}</strong><label>Ideias de refeição<select onchange="if(this.value){meal(${i},'notes',this.value);render()}"><option value="">Escolher ideia</option>${options[i].map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><small>Informe os macros da porção consumida, se desejar.</small><div class="grid">${keys.map((k,j)=>`<label>${['kcal','Proteína (g)','Carboidrato (g)','Gordura (g)'][j]}<br><input type="number" min="0" step="any" value="${esc(d.meals[i]?.[k])}" onchange="meal(${i},'${k}',this.value);render()"></label>`).join('')}</div></div>`).join('')}</section>`}
let shopping=[];try{shopping=JSON.parse(localStorage.getItem('health-shopping')||'null')||[]}catch(e){};if(!shopping.length)shopping=['Proteínas|Frango','Proteínas|Ovos','Proteínas|Carne bovina','Laticínios|Leite','Laticínios|Iogurte','Hortifruti|Banana','Hortifruti|Morango','Hortifruti|Brócolis','Hortifruti|Alface','Hortifruti|Batata','Mercearia|Aveia','Mercearia|Wrap'].map(x=>({cat:x.split('|')[0],name:x.split('|')[1],done:false}));
function shopSave(){try{localStorage.setItem('health-shopping',JSON.stringify(shopping))}catch(e){}render()}
function shoppingPanel(){return `<section><h2>Lista de compras ✿</h2><div class="row"><input id="shopName" placeholder="Item e quantidade"><input id="shopCat" placeholder="Categoria"><button onclick="if($('shopName').value.trim()){shopping.push({name:$('shopName').value.trim(),cat:$('shopCat').value.trim()||'Outros',done:false});shopSave()}">+ Item</button></div>${[...new Set(shopping.map(x=>x.cat))].map(c=>`<h3>${esc(c)}</h3>${shopping.map((x,i)=>x.cat===c?`<div class="row"><label><input type="checkbox" ${x.done?'checked':''} onchange="shopping[${i}].done=this.checked;shopSave()"> ${esc(x.name)}</label><button onclick="shopping.splice(${i},1);shopSave()">×</button></div>`:'').join('')}`).join('')}</section>`}
let extra={foods:[],recipes:[],goals:[],hidden:[],rest:90};try{Object.assign(extra,JSON.parse(localStorage.getItem('health-extra')||'{}'))}catch(e){}
if(extra.templates)Object.assign(presets,extra.templates);function persist(){extra.templates=presets;try{localStorage.setItem('health-extra',JSON.stringify(extra))}catch(e){alert('Armazenamento cheio. Exporte um backup.')}save()}function refresh(){persist();render()}
function editTemplate(){let n=prompt('Nome da ficha', $('preset')?.value==='Treino livre'?'':$('preset')?.value);if(!n)return;let x=prompt('Exercícios separados por vírgula',(presets[n]||[]).join(', '));if(x!==null){presets[n]=x.split(',').map(x=>x.trim()).filter(Boolean);refresh()}}
function history(n){return Object.entries(db).sort().flatMap(([date,d])=>(d.exercises||[]).filter(e=>e.name.toLowerCase()===n.toLowerCase()).map(e=>({date,sets:e.sets}))).filter(e=>e.sets.some(s=>s.kg!==''&&s.kg!=null&&Number(s.reps)>0))}
function muscle(n){return /puxada|remada|pulldown/i.test(n)?'Costas':/rosca/i.test(n)?'Bíceps':/tríceps/i.test(n)?'Tríceps':/supino/i.test(n)?'Peitoral':/lateral|frontal/i.test(n)?'Ombros':/flexora|stiff/i.test(n)?'Posteriores':/extensora|leg press/i.test(n)?'Quadríceps':/pélvica|abdutora|búlgaro|agachamento|afundo/i.test(n)?'Glúteos':/adutora/i.test(n)?'Adutores':'Outros'}
let restEnd=0;function restStart(){extra.rest=Math.max(1,Number($('restSeconds').value)||90);restEnd=Date.now()+extra.rest*1000;persist();tick()}
const oldTick=tick;tick=function(){oldTick();if($('restClock'))$('restClock').textContent=restEnd?Math.max(0,Math.ceil((restEnd-Date.now())/1000))+' s':'—'};
function exerciseExtras(e,i){let prev=history(e.name).filter(x=>x.date<$('date').value).pop();return `<small>Anterior: ${prev?prev.sets.map(s=>esc(s.kg)+' kg × '+esc(s.reps)).join(' · '):'Sem registro'}</small><label>Grupo muscular <input value="${esc(e.muscle||muscle(e.name))}" onchange="day().exercises[${i}].muscle=this.value;save()"></label><label>Desconforto <input placeholder="Local e intensidade" value="${esc(e.pain)}" onchange="day().exercises[${i}].pain=this.value;save()"></label>${e.sets.map((s,j)=>`<label>Série ${j+1} · tipo <select onchange="updateSet(${i},${j},'type',this.value)">${['Efetiva','Aquecimento','Drop-set','Conjugada'].map(t=>`<option ${s.type===t?'selected':''}>${t}</option>`).join('')}</select></label>`).join('')}`}
function addFood(){let name=prompt('Alimento');if(!name)return;let vals=prompt('Por 100 g: kcal, proteína, carboidrato, gordura (separados por espaço)','');if(vals===null)return;let a=vals.trim().split(/\s+/).map(Number);if(a.length!==4||a.some(x=>!Number.isFinite(x)||x<0))return alert('Informe quatro números válidos.');extra.foods.push({name,a});refresh()}
function addRecipe(){let name=prompt('Nome da receita');if(!name)return;let ingredients=prompt('Ingredientes separados por vírgula','');if(ingredients===null)return;let prep=prompt('Preparo','');let vals=prompt('Macros por porção: kcal proteína carboidrato gordura (opcional)','');let a=vals?.trim().split(/\s+/).map(Number);extra.recipes.push({name,ingredients,prep,a:a?.length===4&&a.every(x=>Number.isFinite(x)&&x>=0)?a:null});refresh()}
function logFood(i){let f=extra.foods[Number($('food'+i).value)],g=Number($('grams'+i).value);if(!f||g<=0)return;let m=day().meals[i]??={};(m.items??=[]).push({name:f.name,g,a:f.a.map(x=>x*g/100)});m.done=true;refresh()}
function logRecipe(i){let r=extra.recipes[Number($('recipe'+i).value)];if(!r)return;let m=day().meals[i]??={};(m.items??=[]).push({name:r.name,a:r.a});m.done=true;refresh()}
function photo(i,input){let f=input.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),r=Math.min(1,640/Math.max(img.width,img.height));c.width=img.width*r;c.height=img.height*r;c.getContext('2d').drawImage(img,0,0,c.width,c.height);meal(i,'photo',c.toDataURL('image/jpeg',.65));render()};img.src=reader.result};reader.readAsDataURL(f)}
function nutritionExtra(){return `<section><h2>Meu livro de receitas</h2><button onclick="addRecipe()">+ Receita favorita</button> ${extra.recipes.map((r,i)=>`<div class="card"><b>${esc(r.name)}</b><p>${esc(r.ingredients)}</p><p>${esc(r.prep)}</p><button onclick="extra.recipes[${i}].ingredients.split(',').forEach(n=>{if(n.trim()&&!shopping.some(s=>s.name===n.trim()))shopping.push({name:n.trim(),cat:'Receitas',done:false})});shopSave()">Ingredientes → compras</button> <button onclick="extra.recipes.splice(${i},1);refresh()">Excluir</button></div>`).join('')}<h3>Banco de alimentos (por 100 g)</h3><button onclick="addFood()">+ Alimento</button>${extra.foods.map((f,i)=>`<p>${esc(f.name)} · ${f.a.join(' / ')} <button onclick="extra.foods.splice(${i},1);refresh()">×</button></p>`).join('')}<h3>Água</h3><div class="row"><button onclick="set('water',((Number(day().water)||0)+.25).toFixed(2));render()">+ 250 ml</button><button onclick="set('water',((Number(day().water)||0)+.5).toFixed(2));render()">+ 500 ml</button><b>${esc(day().water||0)} L</b></div></section>`+meals.map((m,i)=>{let v=day().meals[i]||{};return `<section><h3>${m} · alimentos e foto</h3><div class="row"><select id="food${i}"><option value="">Alimento</option>${extra.foods.map((f,j)=>`<option value="${j}">${esc(f.name)}</option>`).join('')}</select><input id="grams${i}" type="number" min="1" placeholder="g"><button onclick="if($('food${i}').value!=='')logFood(${i})">Adicionar</button></div><div class="row"><select id="recipe${i}"><option value="">Receita favorita</option>${extra.recipes.map((f,j)=>`<option value="${j}">${esc(f.name)}</option>`).join('')}</select><button onclick="if($('recipe${i}').value!=='')logRecipe(${i})">Registrar porção</button></div>${(v.items||[]).map((f,j)=>`<p>${esc(f.name)} ${f.g?f.g+' g':''} ${f.a?'· '+f.a.map(x=>Math.round(x)).join(' / '):''} <button onclick="day().meals[${i}].items.splice(${j},1);refresh()">×</button></p>`).join('')}<label>Foto da refeição <input type="file" accept="image/*" onchange="photo(${i},this)"></label>${v.photo?`<img class="mealphoto" src="${esc(v.photo)}"><button onclick="meal(${i},'photo','');render()">Remover foto</button>`:''}</section>`}).join('')}
function calendar(){let dt=new Date($('date').value+'T12:00:00'),y=dt.getFullYear(),m=dt.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();return `<section><div class="row"><button onclick="moveMonth(-1)">‹</button><b>${dt.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</b><button onclick="moveMonth(1)">›</button></div><div class="calendar">${['S','T','Q','Q','S','S','D'].map(x=>`<small>${x}</small>`).join('')}${'<span></span>'.repeat(first)}${Array.from({length:n},(_,i)=>{let k=`${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;return `<button class="${k===$('date').value?'active':''}" onclick="$('date').value='${k}';render()">${i+1}${db[k]?.activities?.length?' •':''}</button>`}).join('')}</div></section>`}function moveMonth(n){let d=new Date($('date').value+'T12:00:00');d.setDate(1);d.setMonth(d.getMonth()+n);$('date').value=d.toISOString().slice(0,10);render()}
function report(){let end=new Date($('date').value+'T12:00:00');end.setDate(end.getDate()-end.getDay()+ (end.getDay()===0?0:7));let start=new Date(end);start.setDate(start.getDate()-6);let rows=Object.entries(db).filter(([k])=>k>=start.toISOString().slice(0,10)&&k<=end.toISOString().slice(0,10));return `<section id="report"><h2>Sunday reset</h2><p>${start.toLocaleDateString('pt-BR')} – ${end.toLocaleDateString('pt-BR')}</p><p>${rows.filter(([k,d])=>d.activities?.length).length} dias com atividade · ${rows.reduce((s,[k,d])=>s+(+d.duration||0),0)} min musculação · ${rows.reduce((s,[k,d])=>s+(+d.cardio||0),0)} min cardio</p>${rows.map(([k,d])=>`<div class="card"><b>${k}</b><p>${esc(d.activities.join(', '))} · Energia ${esc(d.energy||'—')} · Dor ${esc(d.pain||'—')} · Humor ${esc(d.moodEmoji||'—')}</p><p>Hábitos: ${esc(d.habits.join(', '))}</p><p>Refeições: ${Object.values(d.meals).filter(m=>m.done).length} · com proteína: ${Object.values(d.meals).filter(m=>m.protein).length}</p>${d.exercises.map(e=>`<p>${esc(e.name)}: ${e.sets.map(s=>esc(s.kg)+' × '+esc(s.reps)).join(' / ')} ${esc(e.pain)}</p>`).join('')}</div>`).join('')}<button onclick="window.print()">Salvar relatório em PDF / imprimir</button></section>`}
function progressExtra(){let ns=[...new Set(Object.values(db).flatMap(d=>d.exercises.map(e=>e.name)))];return `<section><h2>Força & recordes</h2>${ns.map(n=>{let h=history(n),max=Math.max(1,...h.flatMap(x=>x.sets.map(s=>+s.kg||0)));return `<details><summary>${esc(n)} · ${h.length?max+' kg (maior carga registrada)':'sem carga'}</summary>${h.map(x=>{let v=Math.max(0,...x.sets.map(s=>+s.kg||0));return `<p>${x.date} · ${v} kg</p><div class="bar" style="width:${v/max*100}%"></div><small>${x.sets.map(s=>esc(s.kg)+' × '+esc(s.reps)).join(' / ')}</small>`}).join('')}</details>`}).join('')}</section><section><h2>Grupos musculares · últimos 7 dias</h2>${(()=>{let end=$('date').value,st=new Date(end+'T12:00:00');st.setDate(st.getDate()-6);let counts={};Object.entries(db).filter(([k])=>k>=st.toISOString().slice(0,10)&&k<=end).forEach(([k,d])=>d.exercises.forEach(e=>{let n=e.muscle||muscle(e.name);counts[n]=(counts[n]||0)+e.sets.filter(s=>+s.reps>0&&s.type!=='Aquecimento').length}));return Object.entries(counts).map(([n,v])=>`<p>${esc(n)} · ${v} séries</p><div class="bar" style="width:${Math.min(100,v*5)}%"></div>`).join('')||'Sem séries registradas'})()}</section>`+report()}
const baseRender=render;render=function(){baseRender();let d=day(),v=$('view');if(tab===0){v.insertAdjacentHTML('afterbegin',calendar());v.insertAdjacentHTML('beforeend',`<section><h2>Metas do mês</h2><button onclick="let n=prompt('Meta de saúde ou desempenho');if(n){extra.goals.push({name:n,month:$('date').value.slice(0,7),done:false});refresh()}">+ Meta</button>${extra.goals.map((g,i)=>g.month===$('date').value.slice(0,7)?`<label><input type="checkbox" ${g.done?'checked':''} onchange="extra.goals[${i}].done=this.checked;persist()"> ${esc(g.name)} <button onclick="extra.goals.splice(${i},1);refresh()">×</button></label>`:'').join('')}</section><section><details><summary>Personalizar início</summary>${['Calendário','Indicadores','Hábitos','Metas'].map((n,i)=>`<label><input type="checkbox" ${extra.hidden.includes(i)?'':'checked'} onchange="extra.hidden=this.checked?extra.hidden.filter(x=>x!==${i}):[...extra.hidden,${i}];refresh()">${n}</label>`).join('')}</details></section>`);let blocks=[v.firstElementChild,v.querySelector('.grid'),[...v.querySelectorAll('section')].find(s=>s.textContent.includes('Daily habits')),[...v.querySelectorAll('section')].find(s=>s.textContent.includes('Metas do mês'))];extra.hidden.forEach(i=>{if(blocks[i])blocks[i].style.display='none'})}if(tab===1)v.insertAdjacentHTML('afterbegin',`<section><h2>Como me sinto?</h2>${['😊','😌','😐','😔','😫'].map(x=>`<button class="${d.moodEmoji===x?'active':''}" onclick="set('moodEmoji','${x}');render()">${x}</button>`).join('')}${scale('fatigue','Fadiga')}${scale('soreness','Dor muscular')}${scale('recovery','Recuperação percebida')}</section>`);if(tab===2){v.insertAdjacentHTML('afterbegin',`<section><h3>Descanso entre séries</h3><div class="row"><input id="restSeconds" type="number" min="1" value="${extra.rest}"><button onclick="restStart()">▶ Descanso</button><button onclick="restEnd=0;tick()">Parar</button><b id="restClock">—</b></div><button onclick="editTemplate()">Criar / editar ficha</button> <button onclick="let n=$('preset').value;if(presets[n]&&confirm('Excluir ficha?')){delete presets[n];refresh()}">Excluir ficha selecionada</button></section>`);let sections=[...v.querySelectorAll('section')];d.exercises.forEach((e,i)=>{let s=sections.find(s=>s.querySelector('strong')?.textContent===e.name&&!s.dataset.extra);if(s){s.dataset.extra='1';s.insertAdjacentHTML('beforeend',exerciseExtras(e,i))}})}if(tab===3){v.insertAdjacentHTML('beforeend',nutritionExtra());let a=[0,0,0,0],found=false;Object.values(d.meals).forEach(m=>(m.items||[]).forEach(f=>{if(f.a){found=true;f.a.forEach((x,i)=>a[i]+=x)}}));if(found)v.insertAdjacentHTML('afterbegin',`<section><h3>Macros calculados dos alimentos cadastrados</h3><div class="grid">${a.map((x,i)=>`<div class="tile">${['kcal','Proteína g','Carboidrato g','Gordura g'][i]}<div class="big">${Math.round(x)}</div></div>`).join('')}</div><small>Totais parciais; não somar aos valores manuais se forem os mesmos alimentos.</small></section>`)}if(tab===4)v.insertAdjacentHTML('beforeend',progressExtra());tick()};
backup=function(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({days:db,habits,shopping,extra},null,2)],{type:'application/json'}));a.download='health-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};const oldRestore=$('restore').onchange;$('restore').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let b=JSON.parse(await file.text());if(!b.days||!Object.entries(b.days).every(([k,d])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&Array.isArray(d.exercises)&&Array.isArray(d.activities)&&Array.isArray(d.habits)&&d.meals))throw Error();if(!confirm('Substituir os registros pelo backup?'))return;db=b.days;habits=b.habits||habits;shopping=b.shopping||shopping;extra=b.extra||extra;if(extra.templates){Object.keys(presets).forEach(k=>delete presets[k]);Object.assign(presets,extra.templates)}localStorage.setItem('health-habits',JSON.stringify(habits));localStorage.setItem('health-shopping',JSON.stringify(shopping));refresh()}catch(e){alert('Backup inválido ou armazenamento insuficiente')}};
